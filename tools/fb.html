  <section data-tab="mais" class="panel" id="langPanel">
    <h2>Jeito de explicar</h2>
    <div class="sm muted">Simples: frases curtas e palavras do dia a dia ("pontos" e "tarefas"). Completo: explica mais, com os termos de jogo (XP, quests, boss).</div>
    <div class="chips" id="langPick"><button type="button" data-v="simples">Simples</button><button type="button" data-v="completo">Completo</button></div>
  </section>
  <section data-tab="mais" class="panel" id="fbPanel">
    <h2>Sugerir melhoria</h2>
    <div class="sm muted">O que está chato, confuso ou faltando? Pode ser curto. A mensagem sai pelo WhatsApp: é só escolher para quem mandar.</div>
    <textarea id="fbText" rows="4" maxlength="800" placeholder="Ex.: queria uma quest para beber água" style="font:inherit;width:100%;background:rgba(0,212,255,.04);border:1px solid var(--line);color:var(--fg);border-radius:3px;padding:9px 10px"></textarea>
    <div class="row"><button class="go" type="button" id="fbSend">Enviar pelo WhatsApp</button></div>
    <div class="sm muted" id="fbMsg"></div>
  </section>
