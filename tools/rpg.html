  <section data-tab="prog" class="panel rpg" id="dunPanel">
    <div class="qhead"><h2>🏰 Masmorra da semana</h2><span class="sm muted" id="dunCount"></span></div>
    <div class="dun" id="dunFloors"></div>
    <div class="sm muted" id="dunText"></div>
    <div class="row"><button class="go" type="button" id="dunOpen" hidden>Abrir o baú da masmorra</button></div>
  </section>
  <section data-tab="prog" class="panel rpg" id="rpgPanel">
    <div class="qhead"><h2>Atributos e habilidades</h2><span class="sm muted" id="rpgCls"></span></div>
    <div class="sm muted" id="rpgAwake"></div>
    <button class="link" type="button" id="clsChange">Escolher ou trocar classe</button>
    <div id="rpgStats" class="rpgstats"></div>
  </section>

  <section data-tab="prog" class="panel rpg" id="chestPanel">
    <div class="qhead"><h2>🎁 Baú de recompensas</h2><span class="mono" id="coins">0 moedas</span></div>
    <p class="sm muted">Cada 10 XP vira 1 moeda. Troque por recompensas que você mesmo escolhe. Recompensa planejada não é culpa, é combustível.</p>
    <div id="chestList" class="chestlist"></div>
    <form class="add" id="chestForm"><input id="chestT" aria-label="Recompensa" maxlength="40" autocomplete="off" placeholder="Ex.: um episódio da série"><input id="chestC" aria-label="Preço em moedas" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="moedas" class="coinin"><button class="go" type="submit">Criar</button></form>
  </section>
